# PR と main への push で、必須チェック（docs/development-guidelines.md）を全て実行する
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチで新しく push されたら、古い実行を取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions はコミットの SHA で固定する（更新は Dependabot に任せる）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # CI ではビルド済みの dist/ を配信して E2E を実行する（playwright.config.ts）
      - run: pnpm test:e2e
